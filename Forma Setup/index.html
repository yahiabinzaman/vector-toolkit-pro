<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColorLab Forma Setup Pro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <img src="icons/icon-48.png" alt="Logo" class="brand-icon">
      <div class="brand-title">
        <span>Forma Setup Pro</span>
        <span class="version-badge">v1.2</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="btnRefreshDocs" class="icon-btn" title="Refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content (Single Clean View) -->
  <main class="tab-content">

    <!-- Status Banner -->
    <div id="statusBanner" class="status-banner">
      <span id="statusIcon">ℹ️</span>
      <span id="statusText">Ready</span>
    </div>

    <!-- 1. Diary Size Selection (3 Presets) -->
    <div class="card">
      <div class="card-title">
        <span>১. ডায়েরি সাইজ (Diary Size)</span>
        <span class="badge" id="badgeDiarySize">2 No. Size</span>
      </div>
      <div class="size-btn-group">
        <button type="button" class="btn-size-preset" data-size="size1">
          <span class="size-title">1 No. Size</span>
          <span class="size-desc">কম ব্যবহার হয়</span>
        </button>
        <button type="button" class="btn-size-preset active" data-size="size2">
          <span class="size-title">⭐ 2 No. Size</span>
          <span class="size-desc">বেশি ব্যবহার (Default)</span>
        </button>
        <button type="button" class="btn-size-preset" data-size="size3">
          <span class="size-title">3 No. Size</span>
          <span class="size-desc">সাইজ ৩</span>
        </button>
      </div>
    </div>

    <!-- 2. Section Type -->
    <div class="card">
      <div class="card-title">
        <span>২. সেকশন (Section Type)</span>
      </div>
      <div class="form-row">
        <div class="form-group" style="flex: 1;">
          <label for="selSectionType">ধরন:</label>
          <select id="selSectionType">
            <option value="album_16" selected>Album (16 Page)</option>
            <option value="note_16">Note (16 Page)</option>
            <option value="inner_32">Inner (32 Page - 2 Formas)</option>
            <option value="inner_48">Inner (48 Page - 3 Formas)</option>
            <option value="album_8">Album (8 Page)</option>
          </select>
        </div>
        <div id="batchGroup" class="form-group" style="flex: 1; display: none;">
          <label for="selFormaBatch">ব্যাচ (Forma Batch):</label>
          <select id="selFormaBatch">
            <option value="1" selected>Forma 1 (Pages 1 - 16)</option>
            <option value="2">Forma 2 (Pages 17 - 32)</option>
            <option value="3">Forma 3 (Pages 33 - 48)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 3. Interactive Diagram Preview -->
    <div class="diagram-container">
      <div class="diagram-header">
        <span style="font-weight: 600; color: #cbd5e1;">আর্টবোর্ড লেআউট প্রিভিউ (4x4)</span>
        <span id="diagramInfo" style="color: #38bdf8; font-weight: 600;">16 Artboards</span>
      </div>
      <div id="impositionGridPreview" class="imposition-grid-preview" style="grid-template-columns: repeat(4, 1fr);">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Submit Button -->
    <button id="btnRunImposition" class="btn-primary" style="padding: 13px 14px; font-size: 13px; margin-top: 4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span>⚡ এক ক্লিকে ফর্মা সেটআপ করুন (Setup Forma)</span>
    </button>

    <div style="font-size: 10px; color: #94a3b8; text-align: center; margin-top: 6px;">
      💡 পেজ ১-১৬ সিলেক্ট করে বাটনে ক্লিক করুন। স্বয়ংক্রিয়ভাবে আর্টবোর্ডের নির্দিষ্ট স্থানে ঘুরে বসে যাবে।
    </div>

  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <span>ColorLab Digital & Offset Press</span>
    <button type="button" id="authorGithubLink" data-url="https://github.com/yahiabinzaman" class="author-link" title="Open GitHub Profile">
      <svg class="github-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      <span>Developed by <b>Yahia Bin Zaman</b></span>
    </button>
  </footer>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
